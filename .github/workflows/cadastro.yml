# Cadastro pelo site: a aba Cadastro abre uma issue com o pedido criptografado.
# Aqui a Action abre o pedido, confere a senha (secret ADMIN_PASSWORD), grava o
# configs/<nome>.json, republica o painel e responde/fecha a issue.
name: Cadastro pelo site

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: cadastro
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.event.issue.title, '[livewatch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abrir e aplicar o pedido
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LIVEWATCH_PRIVATE_KEY: ${{ secrets.LIVEWATCH_PRIVATE_KEY }}
        run: node scripts/apply-request.mjs

      - name: Gravar e republicar
        if: steps.apply.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.apply.outputs.summary }}
        run: |
          git config user.name "livewatch-cadastro"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs
          git commit -m "Cadastro: $SUMMARY"
          git push
          gh workflow run pages.yml --ref main

      - name: Responder e fechar a issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.apply.outputs.message }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Pedido de cadastro processado."
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "${MSG:-❌ Não consegui processar o pedido.}"
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
