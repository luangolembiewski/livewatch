# Publica o painel (só visualização) no GitHub Pages e atualiza o status das lives.
# As chaves ficam em Settings → Secrets and variables → Actions (nunca no código).
name: Painel no GitHub Pages

on:
  schedule:
    - cron: '*/5 * * * *'   # mínimo do GitHub; na prática pode atrasar alguns minutos
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir que nenhum segredo está no repositório
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env está no repositório! Remova e troque as chaves."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar site e status
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          DEFAULT_CONFIG: ${{ vars.DEFAULT_CONFIG }}
        run: node scripts/build-pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
